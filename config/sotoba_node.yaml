/**:
  ros__parameters:
    # 購読する LaserScan のトピック
    scan_topic: "/scan"

    # --- 点群の前処理 ---
    # ICPバッファの容量。1スキャンがこれを超える分は捨てる
    max_points: 2048
    # 点の間引き (1なら間引かない)。計算量は点数に比例する
    point_stride: 1
    # 採用する距離の範囲 [m]。0以下なら LaserScan 側の range_min / range_max を使う
    range_min: 0.0
    range_max: 0.0

    # --- ICP ---
    max_loop_num: 20
    # 対応点として採用する距離 [m] (最終反復のゲート)
    # ロボコン2026フィールドは壁の間隔が狭いので、既定より小さめにしてある
    accept_distance: 0.2
    # 0より大きければ、1回目をこの距離として等比でゲートを絞る。初期ずれが大きいとき用
    accept_distance_begin: 0.8
    # 姿勢更新量がこれ未満になったら打ち切る。0なら打ち切らない
    convergence_delta: 0.0
    # Tikhonov正則化。0..2 が回転(roll, pitch, yaw)、3..5 が並進(x, y, z)。
    # 2D LiDAR では roll / pitch / z が観測できないので、そこは必ず拘束すること。
    # yaw の 0.01 は、円柱のような回転対称オブジェクトでランク落ちして
    # solve_failed になるのを防ぐための気持ち程度の値
    tikhonov: [1.0, 1.0, 0.01, 0.0, 0.0, 1.0]

    # --- 重み付け (0なら無効) ---
    # 距離方向の標準偏差 [m]
    sigma_range: 0.0
    # 角度方向の標準偏差 [rad]
    sigma_angle: 0.0
    # Huberの閾値。sigma_* が0なら単位は [m]
    huber_k: 0.0

    # --- RViz2 表示 ---
    # オブジェクトの形状を MarkerArray で出すか
    publish_markers: true
    # 枠線の太さ [m]
    marker_line_width: 0.03
    # Marker の寿命 [s]。0なら消えない
    marker_lifetime: 0.0
    # 長方形の法線を描く長さ [m]。0なら描かない
    marker_normal_length: 0.2
    # オブジェクト名をテキストで出すか
    marker_show_labels: true

    # --- 事前分布 ---
    # internal / external / external_or_internal
    prior_source: "internal"
    # 持続予測で1秒あたりに増やす不確かさ
    process_noise_angular: 0.5  # [rad^2/s]
    process_noise_linear: 0.5   # [m^2/s]
    # 外部の事前がこれより古ければ内蔵にフォールバック [s]
    prior_timeout: 0.5

    # --- 復帰処理 ---
    # 連続してこの回数だけ更新に失敗したら初期姿勢へ戻す (0で無効)
    reset_after_failures: 0
